name: Refresh profile stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require owner token
        if: env.STATS_TOKEN == ''
        run: |
          echo "::warning::STATS_TOKEN secret is not set; skipping so private contributions are not dropped."
      - uses: actions/setup-python@v5
        if: env.STATS_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Generate SVGs
        if: env.STATS_TOKEN != ''
        run: python scripts/stats.py ATICHOF
      - name: Commit changes
        if: env.STATS_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg assets/activity.svg assets/trophies.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile stats"
            git push
          fi
