<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Monthly contributions">
  <style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .serif { font-family: Georgia, 'Times New Roman', Times, serif; }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .bar { transform-box: fill-box; transform-origin: bottom; animation: wave 2.8s ease-in-out infinite; }
  @keyframes wave { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.9); } }
  .avg { stroke-dasharray: 6 6; animation: march 1.5s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -12; } }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123456"/><stop offset="1" stop-color="#0B2540"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#5EC4D6" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#5EC4D6" stop-opacity=".14"/><stop offset="1" stop-color="#5EC4D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EC4D6"/><stop offset="1" stop-color="#0E7490" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="best" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A066"/><stop offset="1" stop-color="#E07B39" stop-opacity=".6"/>
    </linearGradient>
  </defs>
