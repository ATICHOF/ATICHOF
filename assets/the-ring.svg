<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="The Ring">
  <style>
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 2.4s ease-in-out infinite; }
    .b2 { animation-delay: .3s; } .b3 { animation-delay: .6s; } .b4 { animation-delay: .9s; }
    @keyframes grow { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.8); } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ripple 3s ease-in-out infinite; }
    .r2 { animation-delay: .4s; } .r3 { animation-delay: .8s; }
    @keyframes ripple { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .route { animation: dash 2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .flow line { stroke-dasharray: 3 5; animation: dash 1.6s linear infinite; }
</style>
  <rect width="600" height="320" rx="18" fill="#0B2540"/>
  <rect x="0.5" y="0.5" width="599" height="319" rx="18" fill="none" stroke="#5EC4D6" stroke-opacity=".18"/>

  <g>
    <text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2.5" fill="#5EC4D6">MOBILE · AI</text>
    <text x="40" y="106" font-family="Georgia, 'Times New Roman', Times, serif" font-size="44" fill="#F5F1EA">The Ring<tspan fill="#E07B39">.</tspan></text>
  </g>
  <text x="40" y="150" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#B9C4D0"><tspan x="40" dy="0">Social event discovery with self-healing</tspan>
<tspan x="40" dy="26">AI enrichment and moderation pipelines.</tspan>
<tspan x="40" dy="26">Live on iOS and Android.</tspan></text>
  <g>
    <rect x="40" y="244" width="116" height="28" rx="14" fill="none" stroke="#5EC4D6" stroke-opacity=".45"/>
    <text x="98" y="262.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#CFE8EE">React Native</text>
    <rect x="164" y="244" width="53" height="28" rx="14" fill="none" stroke="#5EC4D6" stroke-opacity=".45"/>
    <text x="190" y="262.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#CFE8EE">Expo</text>
    <rect x="225" y="244" width="84" height="28" rx="14" fill="none" stroke="#5EC4D6" stroke-opacity=".45"/>
    <text x="267" y="262.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#CFE8EE">Supabase</text>
    <rect x="317" y="244" width="69" height="28" rx="14" fill="none" stroke="#5EC4D6" stroke-opacity=".45"/>
    <text x="352" y="262.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#CFE8EE">Python</text>
    <rect x="394" y="244" width="69" height="28" rx="14" fill="none" stroke="#5EC4D6" stroke-opacity=".45"/>
    <text x="428" y="262.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#CFE8EE">Gemini</text>
  </g>

  <g transform="translate(446 34)">
      <g fill="none" stroke="#5EC4D6" stroke-width="2">
        <circle cx="60" cy="60" r="16" class="ring r1"/>
        <circle cx="60" cy="60" r="34" class="ring r2" stroke-opacity=".6"/>
        <circle cx="60" cy="60" r="52" class="ring r3" stroke-opacity=".3"/>
      </g>
      <circle cx="60" cy="60" r="6" fill="#E07B39"/>
  </g>
  <g>
    <circle cx="556" cy="290" r="4" fill="#E07B39" class="pulse"/>
    <text x="544" y="294" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2" fill="#8A99AB">LIVE ON STORES</text>
  </g>
</svg>
